<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar ligação — Pesquisa de Qualidade - Agente Comunitário de Saúde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <header class="app-topbar">
    <div class="app-brand"><strong>Pesquisa de Qualidade</strong><span class="app-brand__divider"></span><span>Agente Comunitário de Saúde</span></div>
    <div class="app-actions">
      <a id="lnk-dashboard" class="btn btn-secondary hidden" href="dashboard.html">Painel de gestão</a>
      <a id="lnk-admin" class="btn btn-secondary hidden" href="admin.html">Usuários</a>
      <a id="lnk-whats" class="btn btn-secondary hidden" href="mensagem-whatsapp.html">Mensagem WhatsApp</a>
      <button id="btn-logout" class="btn btn-secondary" type="button">Sair</button>
    </div>
  </header>
  <main class="page page--narrow">
    <div class="page__head">
      <div class="eyebrow">Pesquisa telefônica</div>
      <h1 class="page__title">Registrar ligação</h1>
    </div>
    <div id="barra-mailing" class="mailing-bar hidden">
      <div>
        <div class="mailing-bar__titulo" id="mailing-titulo"></div>
        <div class="mailing-bar__info" id="mailing-info"></div>
      </div>
      <button id="btn-pular" type="button" class="btn btn-secondary">Pular contato</button>
    </div>
    <div id="msg-form" class="erro-msg hidden" role="status"></div>
    <form id="form-inquerito" class="card">
      <h2 class="card-title">Dados do atendimento</h2>
      <div class="form-grid">
        <div class="form-group"><label for="microarea">Microárea</label><input type="text" id="microarea" readonly></div>
        <div class="form-group"><label for="acs_nome">ACS</label><input type="text" id="acs_nome" readonly></div>
        <div class="form-group"><label for="endereco_pec">Endereço (e-SUS)</label><input type="text" id="endereco_pec" readonly></div>
        <div class="form-group"><label for="responsavel_familiar">Responsável familiar</label><input type="text" id="responsavel_familiar" readonly></div>
        <div class="form-group"><label for="telefone_contato">Telefone</label><div class="tel-linha">
            <input type="text" id="telefone_contato" readonly>
            <button type="button" id="btn-whats" class="whats-icon hidden" title="Enviar mensagem pelo WhatsApp" aria-label="Enviar mensagem pelo WhatsApp">
              <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            </button>
          </div><small id="tel-extra" class="hint"></small>
          <small id="whats-aviso" class="hint"></small></div>
        <div class="form-group">
          <label for="status_ligacao">Resultado da ligação *</label>
          <select id="status_ligacao" required>
            <option value="">Selecione…</option>
            <option value="atendeu">Atendeu</option>
            <option value="nao_atendeu">Não atendeu</option>
            <option value="caixa_postal">Caixa postal</option>
            <option value="numero_invalido">Número inválido</option>
            <option value="recusou">Recusou responder</option>
          </select>
        </div>
        <div class="form-group">
          <label for="visita_registrada_pec">Visita registrada no e-SUS?</label>
          <select id="visita_registrada_pec"><option value="">—</option><option value="true">Sim</option><option value="false">Não</option></select>
        </div>
        <div class="form-group"><label for="data_visita_pec">Data da visita (e-SUS)</label><input type="date" id="data_visita_pec"></div>
        <div class="form-group">
          <label for="visita_relatada_paciente">Paciente confirma a visita?</label>
          <select id="visita_relatada_paciente"><option value="">—</option><option value="true">Sim</option><option value="false">Não</option></select>
        </div>
        <div class="form-group">
          <label for="conhece_agente">Conhece o agente?</label>
          <select id="conhece_agente"><option value="">—</option><option value="true">Sim</option><option value="false">Não</option></select>
        </div>
        <div class="form-group"><label for="nivel_satisfacao">Satisfação (0–10)</label><input type="number" id="nivel_satisfacao" min="0" max="10" step="1"></div>
      </div>
      <div class="form-group"><label for="observacoes">Observações</label><textarea id="observacoes" rows="3" maxlength="2000"></textarea></div>
      <button type="submit" class="btn btn-primary">Salvar pesquisa</button>
    </form>
  </main>
  <div id="whats-modal" class="modal-backdrop whats-modal hidden" role="dialog" aria-modal="true" aria-labelledby="whats-titulo">
    <div class="modal-card">
      <div class="modal-head"><div><div class="eyebrow">WhatsApp</div><h2 id="whats-titulo">Mensagem inicial</h2></div></div>
      <div id="whats-numero-grupo" class="form-group hidden"><label for="whats-numero">Enviar para</label><select id="whats-numero"></select></div>
      <div class="form-group"><label for="whats-msg">Mensagem (pode editar antes de abrir)</label><textarea id="whats-msg" rows="5" maxlength="1000"></textarea></div>
      <div class="modal-actions">
        <button type="button" id="whats-restaurar" class="btn btn-secondary">Restaurar padrão</button>
        <button type="button" id="whats-fechar" class="btn btn-secondary">Fechar</button>
        <a id="whats-abrir" class="btn btn-whats" target="_blank" rel="noopener noreferrer">Abrir no WhatsApp</a>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
